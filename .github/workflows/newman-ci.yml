name: Postman & Newman CLI Regression CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  newman-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman CLI
        run: npm install -g newman

      - name: Execute Postman Collection via Newman CLI
        run: newman run postman/REST_API_Functional_Regression.postman_collection.json -e postman/QA_Environment.postman_environment.json --reporters cli,junit --reporter-junit-export newman-report.xml

      - name: Upload Newman Execution Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-cli-report
          path: newman-report.xml
